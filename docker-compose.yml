name: live-chat-server

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["./scripts/dev-entrypoint.sh"]
    ports:
      - "${HOST_PORT:-8083}:8080"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-live_chat}
      - JWT_SECRET=${JWT_SECRET:-dev-only-insecure-secret-change-me}
      - GH_TOKEN=${GH_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - HOME=/home/devuser
    volumes:
      - .:/workspace:cached
      - ${HOST_HOME:-${HOME}}/.config/gh:/home/devuser/.config/gh:ro
      - ${HOST_HOME:-${HOME}}/.opencode/bin/opencode:/usr/local/bin/opencode:ro
      - ${HOST_HOME:-${HOME}}/.config/opencode:/home/devuser/.config/opencode:ro
      - ${HOST_HOME:-${HOME}}/.gitconfig:/home/devuser/.gitconfig:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # `cargo run` (and its first build) can take a while before the API
      # accepts connections; the frontend waits for service_healthy.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 300s
    tty: true
    stdin_open: true

  frontend:
    build:
      context: ./frontend
    environment:
      # Proxied from inside this container to the API service by name: "localhost"
      # here is the frontend itself, not the backend.
      - VITE_API_PROXY_TARGET=http://dev:8080
      # Bind-mounted file events are unreliable on Docker Desktop (macOS/Windows)
      # without polling; the cost on Linux is negligible.
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      # Vite watches the bind-mounted source; deps live in the named volume and
      # are (re)installed by the image's entrypoint when the lockfile changes.
      - ./frontend:/workspace:cached
      - frontend_node_modules:/workspace/node_modules
    depends_on:
      dev:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-live_chat}
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-live_chat}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  frontend_node_modules:
