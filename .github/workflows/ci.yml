name: CI

# CI for both components. The Rust job uses the standard toolchain only
# (rustfmt, clippy, test, build). The frontend job runs the component's own
# `make check`-equivalent steps on Node. `Cargo.lock` is the Rust lockfile, so
# every cargo command passes `--locked`: a run then fails if the lock is
# missing or stale instead of quietly resolving a dependency set nobody
# reviewed.

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway Postgres so the DB-backed integration tests actually run
    # instead of silently skipping ("skipped is not passed").
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: live_chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Resolve sqlx compile-time query macros from the committed `.sqlx/`
      # cache (deterministic and fails loudly when the cache is stale); tests
      # still connect at runtime via DATABASE_URL.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/live_chat
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        # `stable` plus the two components the gate needs. The runner ships
        # rustup; pin your toolchain in rust-toolchain.toml if you want CI and
        # local development on the same version, not in two places.
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'backend'

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly the reviewed lockfile; a stale lockfile fails.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

# A `paths:` filter that the change does not touch means this workflow does not
# trigger at all, and a triggered run whose jobs are all gated out reports
# `skipped`, not `passed`. Skipped is not passed: run `make check` locally
# before relying on CI.
