[package]
name = "live-chat-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Real-time chat API: Axum + Tokio + sqlx + PostgreSQL"
license-file = "../LICENSE"

[dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = { version = "0.3", features = ["sink"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
