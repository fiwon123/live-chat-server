<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1113" />
    <meta name="description" content="live-chat — real-time rooms, instant messages." />
    <title>live-chat</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        const stored = localStorage.getItem("livechat.theme");
        const theme = stored === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "light" ? "#f4f7f6" : "#0a1113");
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
