<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1113" />
    <meta name="description" content="Live Chat — real-time rooms, instant messages." />
    <title>Live Chat</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash. The theme
      // is scoped to the conversation panel, so the shell's theme-color stays
      // dark regardless.
      try {
        const stored = localStorage.getItem("livechat.theme");
        document.documentElement.dataset.theme = stored === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
